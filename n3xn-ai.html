<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>n3xn AI - V1.1 Optimized</title>
  <style>
    :root {
      --bg: #0f1115; --panel: #161a22; --card: #1c212b; --border: #2a3140;
      --text: #e8ecf4; --muted: #8b95a8; --accent: #6ea8fe;
      --good: #3dd68c; --warn: #f5a524; --bad: #f31260;
      --user: #2a3a5c; --assistant: #1e2430;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg); color: var(--text);
      height: 100vh; display: flex; flex-direction: column; overflow: hidden;
      contain: layout style paint;
    }
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; background: var(--panel);
      border-bottom: 1px solid var(--border); gap: 12px; flex-wrap: wrap;
      contain: layout style;
    }
    .logo { font-weight: 700; font-size: 1.15rem; color: var(--accent); white-space: nowrap; }
    .header-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    select, button {
      background: var(--card); color: var(--text); border: 1px solid var(--border);
      border-radius: 8px; padding: 8px 12px; font-size: 0.9rem; cursor: pointer;
      contain: layout style;
    }
    select:hover, button:hover { border-color: var(--accent); outline: none; }
    button.primary { background: var(--accent); color: #0f1115; border-color: var(--accent); font-weight: 600; }
    button.primary:hover { filter: brightness(1.08); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    main { flex: 1; display: flex; overflow: hidden; contain: layout style paint; }
    aside {
      width: 280px; background: var(--panel); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; overflow-y: auto; flex-shrink: 0;
      contain: layout style;
    }
    .sidebar-section { padding: 12px 14px; border-bottom: 1px solid var(--border); contain: layout style; }
    .sidebar-section h3 {
      font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em;
      color: var(--muted); margin-bottom: 8px;
    }
    .status-line { font-size: 0.85rem; margin-bottom: 6px; display: flex; justify-content: space-between; gap: 8px; }
    .status-ok { color: var(--good); } .status-warn { color: var(--warn); } .status-bad { color: var(--bad); }
    label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 4px; }
    textarea { width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 6px; color: var(--text); padding: 8px; font-size: 0.8rem; font-family: inherit; }
    textarea.system-prompt { height: 60px; resize: vertical; }
    .chat-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; contain: layout style paint; }
    #messages {
      flex: 1; overflow-y: auto; padding: 16px;
      display: flex; flex-direction: column; gap: 12px;
      contain: layout style;
    }
    .msg {
      max-width: 90%; padding: 10px 14px; border-radius: 12px;
      line-height: 1.5; font-size: 0.95rem; word-break: break-word; white-space: pre-wrap;
      contain: layout style paint;
    }
    .msg.user { align-self: flex-end; background: var(--user); border-bottom-right-radius: 4px; }
    .msg.assistant { align-self: flex-start; background: var(--assistant); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
    .msg.system { align-self: center; background: transparent; color: var(--muted); font-size: 0.8rem; text-align: center; max-width: 100%; }
    .input-area {
      padding: 12px 16px 16px; border-top: 1px solid var(--border);
      background: var(--panel); display: flex; gap: 10px; align-items: flex-end;
      contain: layout style;
    }
    #userInput {
      flex: 1; background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; color: var(--text); padding: 12px 14px;
      font-size: 0.95rem; resize: none; min-height: 44px; max-height: 120px; font-family: inherit;
    }
    #userInput:focus { outline: none; border-color: var(--accent); }
    #sendBtn { height: 44px; padding: 0 16px; border-radius: 12px; }
    #progressOverlay {
      display: none; position: fixed; inset: 0; background: rgba(15,17,21,0.85);
      z-index: 100; align-items: center; justify-content: center; flex-direction: column; gap: 16px;
    }
    #progressOverlay.visible { display: flex; }
    .progress-box {
      background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
      padding: 20px 28px; min-width: 280px; max-width: 90vw; text-align: center;
    }
    .progress-bar-bg { height: 6px; background: var(--card); border-radius: 3px; overflow: hidden; margin: 12px 0 8px; }
    .progress-bar { height: 100%; background: var(--accent); width: 0%; transition: width 0.2s; }
    .perf-info { font-size: 0.7rem; color: var(--muted); margin-top: 8px; line-height: 1.2; }
  </style>
</head>
<body>
  <div id="progressOverlay">
    <div class="progress-box">
      <div id="progressTitle" style="font-weight:600;margin-bottom:4px">Loading…</div>
      <div class="progress-bar-bg"><div class="progress-bar" id="progressBar"></div></div>
      <div id="progressText" style="font-size:0.9rem;color:var(--muted)">Starting…</div>
    </div>
  </div>

  <header>
    <div class="logo">n3xn AI</div>
    <div class="header-controls">
      <select id="modelSelect">
        <option value="">Select model…</option>
        <optgroup label="Ultra-fast">
          <option value="SmolLM2-360M-Instruct-q4f16_1-MLC">SmolLM2 360M (~210 MB)</option>
          <option value="Qwen2.5-0.5B-Instruct-q4f16_1-MLC" selected>Qwen2.5 0.5B (~280 MB)</option>
        </optgroup>
        <optgroup label="Better quality (slower)">
          <option value="Llama-3.2-1B-Instruct-q4f16_1-MLC">Llama 3.2 1B (~710 MB)</option>
        </optgroup>
      </select>
      <button id="loadBtn" class="primary">Load</button>
      <button id="clearBtn">Clear</button>
    </div>
  </header>

  <main>
    <aside id="sidebar">
      <div class="sidebar-section">
        <h3>Status</h3>
        <div class="status-line"><span>WebLLM</span><span id="webllmStatus">init…</span></div>
        <div class="status-line"><span>Model</span><span id="modelStatus">None</span></div>
        <div class="status-line"><span>Engine</span><span id="engineStatus">Idle</span></div>
        <div class="status-line"><span>Context</span><span id="contextStatus">0/5</span></div>
      </div>

      <div class="sidebar-section">
        <h3>System Prompt</h3>
        <label for="systemPrompt">Short & snappy</label>
        <textarea id="systemPrompt" class="system-prompt"></textarea>
      </div>

      <div class="sidebar-section">
        <h3>Perf</h3>
        <div class="perf-info" id="perfInfo">—</div>
      </div>
    </aside>

    <div class="chat-area">
      <div id="messages"></div>
      <div class="input-area">
        <textarea id="userInput" placeholder="Ask…" rows="1"></textarea>
        <button id="sendBtn" class="primary" disabled>Send</button>
      </div>
    </div>
  </main>

  <script type="module">
    // ============ Optimizations ============
    const CONFIG = {
      MAX_TOKENS: 128,           // Ultra-fast generation
      BATCH_UPDATE_INTERVAL: 3,  // Update UI every 3 tokens
      MAX_CONTEXT_MESSAGES: 5,   // Keep only last 5 messages
      TEMPERATURE: 0.6,          // Slightly lower = faster + more deterministic
    };

    let engine = null;
    let isGenerating = false;
    let webllmReady = false;
    let CreateMLCEngine = null;
    let conversationHistory = [];
    let tokenTimings = [];

    const STORAGE_PROMPT = "n3xn-ai-prompt-v2";
    const STORAGE_HISTORY = "n3xn-ai-history-v2";
    const DB_NAME = "n3xn-ai-models";

    const DEFAULT_SYSTEM = "You are n3xn AI. Be brief and helpful. Low-end device, so keep it short.";

    const $ = (id) => document.getElementById(id);

    function addMessage(role, content) {
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      div.textContent = content;
      $("messages").appendChild(div);
      // Optimized: use transform instead of scrollTop
      requestAnimationFrame(() => {
        $("messages").scrollTop = $("messages").scrollHeight;
      });
      return div;
    }

    function setStatus(id, text, cls = "") {
      const el = $(id);
      if (el) { el.textContent = text; el.className = cls; }
    }

    function showProgress(show, title = "Loading…", text = "", pct = 0) {
      const overlay = $("progressOverlay");
      if (show) {
        overlay.classList.add("visible");
        $("progressTitle").textContent = title;
        $("progressText").textContent = text;
        $("progressBar").style.width = Math.min(100, pct) + "%";
      } else {
        overlay.classList.remove("visible");
      }
    }

    // ============ IndexedDB Caching ============
    async function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onerror = () => reject(req.error);
        req.onsuccess = () => resolve(req.result);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains("models")) {
            db.createObjectStore("models", { keyPath: "id" });
          }
        };
      });
    }

    async function getModelCache(modelId) {
      try {
        const db = await openDB();
        return new Promise((resolve) => {
          const tx = db.transaction("models", "readonly");
          const store = tx.objectStore("models");
          const req = store.get(modelId);
          req.onerror = () => resolve(null);
          req.onsuccess = () => resolve(req.result?.cached || false);
        });
      } catch { return false; }
    }

    async function setModelCache(modelId) {
      try {
        const db = await openDB();
        const tx = db.transaction("models", "readwrite");
        const store = tx.objectStore("models");
        store.put({ id: modelId, cached: true, timestamp: Date.now() });
      } catch {}
    }

    // ============ WebLLM Loading ============
    function buildCandidates() {
      const base = location.origin;
      return [
        base + "/__cdn__/jsdelivr/npm/@mlc-ai/web-llm/+esm",
        base + "/__cdn__/jsdelivr/npm/@mlc-ai/web-llm@0.2.85/+esm",
        "https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm/+esm",
        "https://esm.run/@mlc-ai/web-llm",
      ];
    }

    async function tryImport(url) {
      const mod = await import(/* @vite-ignore */ url);
      let factory = mod.CreateMLCEngine;
      if (typeof factory !== "function" && mod.default) {
        factory = mod.default.CreateMLCEngine || mod.default;
      }
      if (typeof factory !== "function") throw new Error("CreateMLCEngine not found");
      return factory;
    }

    async function loadWebLLM() {
      setStatus("webllmStatus", "Loading…", "status-warn");
      addMessage("system", "Initializing WebLLM…");

      for (const url of buildCandidates()) {
        try {
          console.log("[n3xn] Trying CDN:", url);
          CreateMLCEngine = await tryImport(url);
          webllmReady = true;
          setStatus("webllmStatus", "Ready", "status-ok");
          addMessage("system", "WebLLM ready. Select model.");
          return true;
        } catch (err) {
          console.log("[n3xn] Failed:", url, err.message);
        }
      }

      setStatus("webllmStatus", "Failed", "status-bad");
      addMessage("system", "WebLLM load failed.");
      return false;
    }

    async function loadModel() {
      if (!webllmReady || !CreateMLCEngine) return;

      const modelId = $("modelSelect").value;
      if (!modelId) { alert("Select a model"); return; }
      if (isGenerating) return;

      $("loadBtn").disabled = true;
      $("sendBtn").disabled = true;
      setStatus("engineStatus", "Loading…", "status-warn");
      showProgress(true, "Loading model…", "Please wait…", 0);

      try {
        const cached = await getModelCache(modelId);
        if (cached) addMessage("system", "Loading from cache…");

        engine = await CreateMLCEngine(modelId, {
          initProgressCallback: (r) => {
            showProgress(true, "Loading…", r.text || "", (r.progress || 0) * 100);
          }
        });

        await setModelCache(modelId);
        const short = modelId.split("-")[0];
        setStatus("modelStatus", short, "status-ok");
        setStatus("engineStatus", "Ready", "status-ok");
        $("sendBtn").disabled = false;
        addMessage("system", "Ready.");
      } catch (err) {
        setStatus("engineStatus", "Failed", "status-bad");
        addMessage("system", "Load failed: " + err.message);
        console.error(err);
      } finally {
        showProgress(false);
        $("loadBtn").disabled = false;
      }
    }

    // ============ Chat (Optimized) ============
    async function sendMessage() {
      if (!engine || isGenerating) return;

      const input = $("userInput");
      const text = input.value.trim();
      if (!text) return;

      input.value = "";
      addMessage("user", text);
      conversationHistory.push({ role: "user", content: text });
      saveHistory();

      isGenerating = true;
      $("sendBtn").disabled = true;
      setStatus("engineStatus", "Thinking…", "status-warn");

      const replyEl = addMessage("assistant", "…");
      let full = "";
      let tokenCount = 0;
      const startTime = performance.now();

      try {
        const systemPrompt = ($("systemPrompt").value || DEFAULT_SYSTEM).trim();

        // Trim context to last N messages
        const contextMessages = conversationHistory.slice(-CONFIG.MAX_CONTEXT_MESSAGES * 2);

        const messages = [
          { role: "system", content: systemPrompt },
          ...contextMessages
        ];

        const completion = await engine.chat.completions.create({
          messages,
          stream: true,
          temperature: CONFIG.TEMPERATURE,
          max_tokens: CONFIG.MAX_TOKENS,
          top_p: 0.9,
        });

        // Batched UI updates for performance
        for await (const chunk of completion) {
          const delta = chunk.choices[0]?.delta?.content || "";
          full += delta;
          tokenCount++;

          // Only update UI every N tokens
          if (tokenCount % CONFIG.BATCH_UPDATE_INTERVAL === 0) {
            replyEl.textContent = full || "…";
            requestAnimationFrame(() => {
              $("messages").scrollTop = $("messages").scrollHeight;
            });
          }
        }

        replyEl.textContent = full || "(no response)";
        conversationHistory.push({ role: "assistant", content: full });
        saveHistory();

        // Performance metrics
        const elapsed = performance.now() - startTime;
        const tokensPerSec = (tokenCount / elapsed * 1000).toFixed(1);
        tokenTimings.push(tokensPerSec);
        if (tokenTimings.length > 10) tokenTimings.shift();

        const avgTPS = (tokenTimings.reduce((a, b) => parseFloat(a) + parseFloat(b), 0) / tokenTimings.length).toFixed(1);
        $("perfInfo").textContent = `${avgTPS} tok/s\n${tokenCount} tokens\n${(elapsed / 1000).toFixed(1)}s`;

        setStatus("contextStatus", `${conversationHistory.length}/10`);
      } catch (err) {
        replyEl.textContent = "Error: " + err.message;
        console.error(err);
      } finally {
        isGenerating = false;
        $("sendBtn").disabled = false;
        setStatus("engineStatus", "Ready", "status-ok");
      }
    }

    // ============ Storage ============
    function saveHistory() {
      try {
        // Keep only last 10 for memory
        const trimmed = conversationHistory.slice(-10);
        localStorage.setItem(STORAGE_HISTORY, JSON.stringify(trimmed));
      } catch {}
    }

    function loadHistory() {
      try {
        const saved = localStorage.getItem(STORAGE_HISTORY);
        return saved ? JSON.parse(saved) : [];
      } catch { return []; }
    }

    function saveSystemPrompt(text) {
      try {
        localStorage.setItem(STORAGE_PROMPT, text);
      } catch {}
    }

    function loadSystemPrompt() {
      try {
        return localStorage.getItem(STORAGE_PROMPT) || DEFAULT_SYSTEM;
      } catch { return DEFAULT_SYSTEM; }
    }

    // ============ Events ============
    $("loadBtn").addEventListener("click", loadModel);
    $("clearBtn").addEventListener("click", () => {
      $("messages").innerHTML = "";
      conversationHistory = [];
      saveHistory();
      addMessage("system", "Cleared.");
    });
    $("sendBtn").addEventListener("click", sendMessage);
    $("userInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });
    $("systemPrompt").addEventListener("input", () => {
      saveSystemPrompt($("systemPrompt").value);
    });

    // ============ Init ============
    (async function init() {
      $("systemPrompt").value = loadSystemPrompt();
      conversationHistory = loadHistory();

      addMessage("system", "n3xn AI V1.1 (optimized)");
      await loadWebLLM();
    })();
  </script>
</body>
</html>
