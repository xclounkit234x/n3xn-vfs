<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>n3xn AI - V1</title>
  <style>
    :root {
      --bg: #0f1115; --panel: #161a22; --card: #1c212b; --border: #2a3140;
      --text: #e8ecf4; --muted: #8b95a8; --accent: #6ea8fe;
      --good: #3dd68c; --warn: #f5a524; --bad: #f31260;
      --user: #2a3a5c; --assistant: #1e2430;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg); color: var(--text);
      height: 100vh; display: flex; flex-direction: column; overflow: hidden;
    }
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; background: var(--panel);
      border-bottom: 1px solid var(--border); gap: 12px; flex-wrap: wrap;
    }
    .logo { font-weight: 700; font-size: 1.15rem; color: var(--accent); }
    .header-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    select, button {
      background: var(--card); color: var(--text); border: 1px solid var(--border);
      border-radius: 8px; padding: 8px 12px; font-size: 0.9rem; cursor: pointer;
    }
    select:hover, button:hover { border-color: var(--accent); outline: none; }
    button.primary { background: var(--accent); color: #0f1115; border-color: var(--accent); font-weight: 600; }
    button.primary:hover { filter: brightness(1.08); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    main { flex: 1; display: flex; overflow: hidden; }
    aside {
      width: 300px; background: var(--panel); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; overflow-y: auto; flex-shrink: 0;
    }
    .sidebar-section { padding: 14px 16px; border-bottom: 1px solid var(--border); }
    .sidebar-section h3 {
      font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em;
      color: var(--muted); margin-bottom: 10px;
    }
    .status-line {
      font-size: 0.85rem; margin-bottom: 6px;
      display: flex; justify-content: space-between; gap: 8px;
    }
    .status-ok { color: var(--good); } .status-warn { color: var(--warn); } .status-bad { color: var(--bad); }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 4px; }
    textarea {
      width: 100%; background: var(--card); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); padding: 8px; font-size: 0.85rem;
      font-family: inherit;
    }
    textarea.system-prompt { height: 80px; resize: vertical; }
    .chat-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    #messages {
      flex: 1; overflow-y: auto; padding: 20px 16px;
      display: flex; flex-direction: column; gap: 14px;
    }
    .msg {
      max-width: 90%; padding: 12px 16px; border-radius: 14px;
      line-height: 1.5; font-size: 0.95rem; white-space: pre-wrap; word-break: break-word;
    }
    .msg.user { align-self: flex-end; background: var(--user); border-bottom-right-radius: 4px; }
    .msg.assistant {
      align-self: flex-start; background: var(--assistant);
      border: 1px solid var(--border); border-bottom-left-radius: 4px;
    }
    .msg.system {
      align-self: center; background: transparent; color: var(--muted);
      font-size: 0.85rem; text-align: center; max-width: 100%;
    }
    .input-area {
      padding: 12px 16px 16px; border-top: 1px solid var(--border);
      background: var(--panel); display: flex; gap: 10px; align-items: flex-end;
    }
    #userInput {
      flex: 1; background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; color: var(--text); padding: 12px 14px; font-size: 0.95rem;
      resize: none; min-height: 48px; max-height: 140px; font-family: inherit;
    }
    #userInput:focus { outline: none; border-color: var(--accent); }
    #sendBtn { height: 48px; padding: 0 18px; border-radius: 12px; }
    #progressOverlay {
      display: none; position: fixed; inset: 0; background: rgba(15,17,21,0.85);
      z-index: 100; align-items: center; justify-content: center; flex-direction: column; gap: 16px;
    }
    #progressOverlay.visible { display: flex; }
    .progress-box {
      background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
      padding: 24px 32px; min-width: 300px; max-width: 90vw; text-align: center;
    }
    .progress-bar-bg { height: 8px; background: var(--card); border-radius: 4px; overflow: hidden; margin: 14px 0 8px; }
    .progress-bar { height: 100%; background: var(--accent); width: 0%; transition: width 0.2s; }
    #progressText { font-size: 0.9rem; color: var(--muted); }
  </style>
</head>
<body>
  <div id="progressOverlay">
    <div class="progress-box">
      <div id="progressTitle" style="font-weight:600;margin-bottom:4px">Loading model…</div>
      <div class="progress-bar-bg"><div class="progress-bar" id="progressBar"></div></div>
      <div id="progressText">Starting…</div>
    </div>
  </div>

  <header>
    <div class="logo">n3xn AI - V1</div>
    <div class="header-controls">
      <select id="modelSelect">
        <option value="">Select a model…</option>
        <optgroup label="Tiny (CPU-friendly)">
          <option value="SmolLM2-360M-Instruct-q4f16_1-MLC">SmolLM2 360M (~210 MB)</option>
          <option value="Qwen2.5-0.5B-Instruct-q4f16_1-MLC" selected>Qwen2.5 0.5B (~280 MB)</option>
        </optgroup>
      </select>
      <button id="loadBtn" class="primary">Load Model</button>
      <button id="clearBtn">Clear Chat</button>
    </div>
  </header>

  <main>
    <aside id="sidebar">
      <div class="sidebar-section">
        <h3>Status</h3>
        <div class="status-line"><span>WebLLM</span><span id="webllmStatus">loading…</span></div>
        <div class="status-line"><span>Model</span><span id="modelStatus">None</span></div>
        <div class="status-line"><span>Engine</span><span id="engineStatus">Idle</span></div>
      </div>

      <div class="sidebar-section">
        <h3>System Prompt</h3>
        <label for="systemPrompt">Instructions</label>
        <textarea id="systemPrompt" class="system-prompt"></textarea>
      </div>
    </aside>

    <div class="chat-area">
      <div id="messages"></div>
      <div class="input-area">
        <textarea id="userInput" placeholder="Message n3xn AI…" rows="1"></textarea>
        <button id="sendBtn" class="primary" disabled>Send</button>
      </div>
    </div>
  </main>

  <script type="module">
    let engine = null;
    let isGenerating = false;
    let webllmReady = false;
    let CreateMLCEngine = null;

    const STORAGE_KEY = "n3xn-ai-system-prompt-v1";
    const DEFAULT_SYSTEM = "You are n3xn AI, a helpful local assistant. Be clear, direct, and practical. Keep answers short.";

    const $ = (id) => document.getElementById(id);

    function addMessage(role, content) {
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      div.textContent = content;
      $("messages").appendChild(div);
      $("messages").scrollTop = $("messages").scrollHeight;
      return div;
    }

    function setStatus(id, text, cls = "") {
      const el = $(id);
      if (el) { el.textContent = text; el.className = cls; }
    }

    function showProgress(show, title = "Loading…", text = "", pct = 0) {
      const overlay = $("progressOverlay");
      if (show) {
        overlay.classList.add("visible");
        $("progressTitle").textContent = title;
        $("progressText").textContent = text;
        $("progressBar").style.width = Math.min(100, Math.max(0, pct)) + "%";
      } else {
        overlay.classList.remove("visible");
      }
    }

    // Same URL building strategy as your original working code
    function buildCandidates() {
      const base = location.origin;
      return [
        base + "/__cdn__/jsdelivr/npm/@mlc-ai/web-llm/+esm",
        base + "/__cdn__/jsdelivr/npm/@mlc-ai/web-llm@0.2.85/+esm",
        "https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm/+esm",
        "https://esm.run/@mlc-ai/web-llm",
        "https://esm.sh/@mlc-ai/web-llm",
      ];
    }

    async function tryImport(url) {
      const mod = await import(/* @vite-ignore */ url);
      let factory = mod.CreateMLCEngine;
      if (typeof factory !== "function" && mod.default) {
        factory = mod.default.CreateMLCEngine || mod.default;
      }
      if (typeof factory !== "function") throw new Error("CreateMLCEngine not found");
      return factory;
    }

    async function loadWebLLM() {
      setStatus("webllmStatus", "Loading…", "status-warn");
      addMessage("system", "Initializing WebLLM…");

      for (const url of buildCandidates()) {
        try {
          console.log("[n3xn] Trying:", url);
          CreateMLCEngine = await tryImport(url);
          webllmReady = true;
          setStatus("webllmStatus", "Ready", "status-ok");
          addMessage("system", "WebLLM ready. Select a model and click Load Model.");
          return true;
        } catch (err) {
          console.log("[n3xn] CDN failed:", url, err.message);
        }
      }

      setStatus("webllmStatus", "Failed", "status-bad");
      addMessage("system", "Could not load WebLLM from any CDN.");
      return false;
    }

    async function loadModel() {
      if (!webllmReady || !CreateMLCEngine) {
        addMessage("system", "WebLLM not ready");
        return;
      }

      const modelId = $("modelSelect").value;
      if (!modelId) { alert("Select a model"); return; }
      if (isGenerating) return;

      $("loadBtn").disabled = true;
      $("sendBtn").disabled = true;
      setStatus("engineStatus", "Loading…", "status-warn");
      showProgress(true, "Loading model…", "Please wait…", 0);

      try {
        engine = await CreateMLCEngine(modelId, {
          initProgressCallback: (r) => {
            showProgress(true, "Loading model…", r.text || "", (r.progress || 0) * 100);
          }
        });

        const short = modelId.replace(/-Instruct.*/i, "").replace(/-q4f16.*/i, "");
        setStatus("modelStatus", short, "status-ok");
        setStatus("engineStatus", "Ready", "status-ok");
        $("sendBtn").disabled = false;
        addMessage("system", "Model loaded. Ready to chat.");
      } catch (err) {
        setStatus("engineStatus", "Failed", "status-bad");
        setStatus("modelStatus", "None");
        addMessage("system", "Model load failed: " + err.message);
        console.error(err);
      } finally {
        showProgress(false);
        $("loadBtn").disabled = false;
      }
    }

    async function sendMessage() {
      if (!engine || isGenerating) return;

      const input = $("userInput");
      const text = input.value.trim();
      if (!text) return;

      input.value = "";
      addMessage("user", text);
      isGenerating = true;
      $("sendBtn").disabled = true;
      setStatus("engineStatus", "Thinking…", "status-warn");

      const replyEl = addMessage("assistant", "…");

      try {
        const systemPrompt = ($("systemPrompt").value || DEFAULT_SYSTEM).trim();
        const messages = [
          { role: "system", content: systemPrompt },
          { role: "user", content: text }
        ];

        let full = "";
        const completion = await engine.chat.completions.create({
          messages, stream: true, temperature: 0.7, max_tokens: 256,
        });

        for await (const chunk of completion) {
          const delta = chunk.choices[0]?.delta?.content || "";
          full += delta;
          replyEl.textContent = full || "…";
          $("messages").scrollTop = $("messages").scrollHeight;
        }

        if (!full) replyEl.textContent = "(No response)";
      } catch (err) {
        replyEl.textContent = "Error: " + err.message;
        console.error(err);
      } finally {
        isGenerating = false;
        $("sendBtn").disabled = false;
        setStatus("engineStatus", "Ready", "status-ok");
      }
    }

    $("loadBtn").addEventListener("click", loadModel);
    $("clearBtn").addEventListener("click", () => {
      $("messages").innerHTML = "";
      addMessage("system", "Chat cleared.");
    });
    $("sendBtn").addEventListener("click", sendMessage);
    $("userInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });

    // Storage
    function loadSystemPrompt() {
      try {
        return localStorage.getItem(STORAGE_KEY) || DEFAULT_SYSTEM;
      } catch {
        return DEFAULT_SYSTEM;
      }
    }

    function saveSystemPrompt(text) {
      try {
        localStorage.setItem(STORAGE_KEY, text);
      } catch (e) {}
    }

    $("systemPrompt").addEventListener("input", () => {
      saveSystemPrompt($("systemPrompt").value);
    });

    // Init
    (async function init() {
      $("systemPrompt").value = loadSystemPrompt();
      addMessage("system", "n3xn AI V1 starting…");
      await loadWebLLM();
    })();
  </script>
</body>
</html>
