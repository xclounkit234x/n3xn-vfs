<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NRXN AIR v0.2</title>
<style>
body{margin:0;background:#080b10;color:#dce7f5;font:15px ui-monospace,monospace;display:grid;place-items:center;min-height:100vh}
main{width:min(900px,92vw);padding:28px;border:1px solid #29364a;border-radius:18px;background:#0e1520}
pre{white-space:pre-wrap;line-height:1.5;color:#a9c7ff}
</style>
<main><h1>NRXN AIR · v0.2</h1><pre id="log">Booting NRXN AIR...</pre></main>
<script type="module">
import {AIRRuntime} from "./air.js";
const log=document.querySelector("#log");
const say=x=>log.textContent+="\n"+x;
try{
  const air=await new AIRRuntime().start();
  const s=await air.call("status");
  say(`WASM ready · version ${s.version} · memory ${s.memoryBytes} bytes`);
  const t=await air.selfTest(4*1024*1024);
  say(`AIR allocator OK · pointer ${t.pointer} · memory ${t.capacityAfter} bytes`);
}catch(e){say("ERROR: "+e.message)}
</script>
